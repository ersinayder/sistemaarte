name: Setup PM2 Windows Service
# Roda UMA UNICA VEZ apos provisionar o servidor.
# Registra PM2-Startup e PM2-DeployRestart no Task Scheduler.
# Apos isso: reboots sobem o processo automaticamente
# e deploys via Actions reiniciam via sentinela.

on:
  workflow_dispatch:

jobs:
  setup:
    name: Registrar tarefas no Task Scheduler
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar backend deps
        shell: powershell
        run: |
          Set-Location "C:\sistemaarte\backend"
          npm install --omit=dev

      - name: Iniciar processo no PM2
        shell: powershell
        run: |
          $env:HOMEPATH = "C:\Users\Administrator"
          $env:PM2_HOME = "C:\Users\Administrator\.pm2"
          Set-Location "C:\sistemaarte\backend"
          try { pm2 delete sistemaarte-backend 2>&1 | Out-Null } catch {}
          pm2 start ecosystem.config.js --only sistemaarte-backend --env production
          pm2 save
          pm2 list

      - name: Registrar PM2-Startup (reboot)
        shell: powershell
        run: |
          $action    = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c `"pm2 resurrect`""
          $trigger   = New-ScheduledTaskTrigger -AtStartup
          $principal = New-ScheduledTaskPrincipal -UserId "Administrator" -LogonType S4U -RunLevel Highest
          $settings  = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 5)
          Register-ScheduledTask -TaskName "PM2-Startup" -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force
          Write-Host "PM2-Startup registrado."

      - name: Criar script de restart por sentinela
        shell: powershell
        run: |
          $script = @'
          $env:HOMEPATH = "C:\Users\Administrator"
          $env:PM2_HOME = "C:\Users\Administrator\.pm2"
          $sentinel = "C:\sistemaarte\backend\.deploy-trigger"
          if (Test-Path $sentinel) {
              Remove-Item $sentinel -Force
              & pm2 restart sistemaarte-backend --update-env
              pm2 save
          }
          '@
          $script | Set-Content "C:\sistemaarte\deploy-restart.ps1" -Encoding UTF8
          Write-Host "Script gravado em C:\sistemaarte\deploy-restart.ps1"

      - name: Registrar PM2-DeployRestart (sentinela a cada 1 min)
        shell: powershell
        run: |
          $action    = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-NonInteractive -File C:\sistemaarte\deploy-restart.ps1"
          $trigger   = New-ScheduledTaskTrigger -RepetitionInterval (New-TimeSpan -Minutes 1) -Once -At (Get-Date)
          $principal = New-ScheduledTaskPrincipal -UserId "Administrator" -LogonType S4U -RunLevel Highest
          $settings  = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 2) -MultipleInstances IgnoreNew
          Register-ScheduledTask -TaskName "PM2-DeployRestart" -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force
          Write-Host "PM2-DeployRestart registrado."

      - name: Status final
        shell: powershell
        run: |
          Get-ScheduledTask | Where-Object { $_.TaskName -like 'PM2*' } | Select-Object TaskName, State
