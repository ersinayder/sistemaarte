name: CI - Testes

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  testes:
    name: Testes Backend
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 (requerido pelo nfewizard-io/xsd-schema-validator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias de teste
        working-directory: backend
        run: npm ci

      - name: Audit backend runtime dependencies
        working-directory: backend
        run: npm audit --omit=dev

      - name: Executar testes
        working-directory: backend
        run: npm test
