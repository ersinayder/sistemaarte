name: CI - Testes

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  testes:
    name: Testes Backend
    runs-on: self-hosted

    env:
      HOMEPATH: C:\Users\Administrator
      HOME: C:\Users\Administrator
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias de teste
        working-directory: backend
        run: npm install

      - name: Executar testes
        working-directory: backend
        run: npm test
