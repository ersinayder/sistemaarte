name: Deploy Producao

on:
  push:
    branches:
      - main

jobs:
  testes:
    name: Testes Backend
    runs-on: self-hosted
    env:
      HOMEPATH: C:\Users\Administrator
      HOME: C:\Users\Administrator
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias de teste
        shell: powershell
        working-directory: backend
        run: npm install --ignore-scripts

      - name: Compilar XMLValidator.class
        shell: powershell
        run: |
          $javac = "C:\Program Files\Java\jdk-21\bin\javac.exe"
          $src   = "${{ github.workspace }}\backend\node_modules\xsd-schema-validator\support\XMLValidator.java"
          $out   = "${{ github.workspace }}\backend\node_modules\xsd-schema-validator\support"
          & $javac -d $out $src
          if ($LASTEXITCODE -ne 0) { throw "javac falhou: $LASTEXITCODE" }

      - name: Executar testes
        working-directory: backend
        run: npm test

  build-and-deploy:
    name: Build & Deploy
    runs-on: self-hosted
    needs: testes

    env:
      HOMEPATH: C:\Users\Administrator
      HOME: C:\Users\Administrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy frontend dist
        shell: powershell
        run: |
          $source = "${{ github.workspace }}\frontend\dist\"
          $dest   = "C:\sistemaarte\frontend\dist"
          if (!(Test-Path $dest)) { New-Item -ItemType Directory -Path $dest -Force }
          robocopy $source $dest /MIR /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit $LASTEXITCODE }

      - name: Stop PM2
        shell: powershell
        run: |
          $env:HOMEPATH = "C:\Users\Administrator"
          $env:HOME     = "C:\Users\Administrator"
          pm2 stop sistemaarte-backend 2>$null; $true
          Start-Sleep -Seconds 3

      - name: Sync backend source
        shell: powershell
        run: |
          $source = "${{ github.workspace }}\backend\"
          $dest   = "C:\sistemaarte\backend"
          if (!(Test-Path $dest)) { New-Item -ItemType Directory -Path $dest -Force }
          robocopy $source $dest /MIR /NFL /NDL /NJH /NJS `
            /XD node_modules data `
            /XF .env *.db
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit $LASTEXITCODE }

      - name: Install backend dependencies
        shell: powershell
        run: |
          Set-Location "C:\sistemaarte\backend"
          npm install --production --prefer-offline --ignore-scripts

      - name: Compilar XMLValidator.class em producao
        shell: powershell
        run: |
          $javac = "C:\Program Files\Java\jdk-21\bin\javac.exe"
          $src   = "C:\sistemaarte\backend\node_modules\xsd-schema-validator\support\XMLValidator.java"
          $out   = "C:\sistemaarte\backend\node_modules\xsd-schema-validator\support"
          & $javac -d $out $src
          if ($LASTEXITCODE -ne 0) { throw "javac falhou em producao: $LASTEXITCODE" }

      - name: Reload PM2 via ecosystem
        shell: powershell
        run: |
          $env:HOMEPATH = "C:\Users\Administrator"
          $env:HOME     = "C:\Users\Administrator"
          Set-Location "C:\sistemaarte\backend"
          $status = pm2 describe sistemaarte-backend 2>&1
          if ($status -match 'online|stopped|errored') {
            pm2 delete sistemaarte-backend 2>$null; $true
          }
          pm2 start ecosystem.config.js --env production
          pm2 save

      - name: Concluido
        shell: powershell
        run: Write-Host "Deploy concluido em $(Get-Date -Format 'dd/MM/yyyy HH:mm:ss')"
