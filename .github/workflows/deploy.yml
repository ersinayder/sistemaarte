name: Deploy Producao

on:
  push:
    branches:
      - main

jobs:
  testes:
    name: Testes Backend
    runs-on: self-hosted
    env:
      HOMEPATH: C:\Users\Administrator
      HOME: C:\Users\Administrator
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias de teste
        working-directory: backend
        run: npm install

      - name: Executar testes
        working-directory: backend
        run: npm test

  build-and-deploy:
    name: Build & Deploy
    runs-on: self-hosted
    needs: testes

    env:
      HOMEPATH: C:\Users\Administrator
      HOME: C:\Users\Administrator
      PM2_HOME: C:\Users\Administrator\.pm2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Parar PM2 antes do sync
        shell: powershell
        run: |
          $desc = pm2 describe sistemaarte-backend 2>&1
          if ($desc -match 'online|stopped|errored|launching') {
            Write-Host "Parando processo para liberar arquivos em disco"
            pm2 stop sistemaarte-backend
          } else {
            Write-Host "Processo nao encontrado no daemon atual - prosseguindo"
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy frontend dist
        shell: powershell
        run: |
          $source = "${{ github.workspace }}\frontend\dist\"
          $dest   = "C:\sistemaarte\frontend\dist"
          if (!(Test-Path $dest)) { New-Item -ItemType Directory -Path $dest -Force }
          robocopy $source $dest /MIR /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit $LASTEXITCODE }

      - name: Sync backend source
        shell: powershell
        run: |
          $source = "${{ github.workspace }}\backend\"
          $dest   = "C:\sistemaarte\backend"
          if (!(Test-Path $dest)) { New-Item -ItemType Directory -Path $dest -Force }
          robocopy $source $dest /MIR /E /NFL /NDL /NJH /NJS `
            /XD node_modules data `
            /XF .env *.db
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit $LASTEXITCODE }
          Write-Host "=== Validacao kpis.js ==="
          Get-Content "C:\sistemaarte\backend\routes\kpis.js" | Select-String 'idleTimer' | Select-Object -First 5

      - name: Install backend dependencies
        shell: powershell
        run: |
          Set-Location "C:\sistemaarte\backend"
          npm install --omit=dev --prefer-offline

      - name: Iniciar ou reiniciar PM2
        shell: powershell
        run: |
          Set-Location "C:\sistemaarte\backend"
          $desc = pm2 describe sistemaarte-backend 2>&1
          if ($desc -match 'online|stopped|errored|launching') {
            Write-Host "Reiniciando processo existente"
            pm2 restart sistemaarte-backend --update-env
          } else {
            Write-Host "Iniciando processo pela primeira vez"
            pm2 start ecosystem.config.js --only sistemaarte-backend --env production
            pm2 save
          }
          Start-Sleep -Seconds 3
          pm2 list

      - name: Concluido
        shell: powershell
        run: Write-Host "Deploy concluido em $(Get-Date -Format 'dd/MM/yyyy HH:mm:ss')"
