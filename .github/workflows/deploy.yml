name: Deploy Producao

on:
  push:
    branches:
      - main

jobs:
  testes:
    name: Testes Backend
    runs-on: self-hosted
    env:
      HOMEPATH: C:\Users\Administrator
      HOME: C:\Users\Administrator
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias de teste
        working-directory: backend
        run: npm install

      - name: Executar testes
        working-directory: backend
        run: npm test

  build-and-deploy:
    name: Build & Deploy
    runs-on: self-hosted
    needs: testes

    env:
      HOMEPATH: C:\Users\Administrator
      HOME: C:\Users\Administrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy frontend dist
        shell: powershell
        run: |
          $source = "${{ github.workspace }}\frontend\dist\"
          $dest   = "C:\sistemaarte\frontend\dist"
          if (!(Test-Path $dest)) { New-Item -ItemType Directory -Path $dest -Force }
          robocopy $source $dest /MIR /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit $LASTEXITCODE }

      - name: Sync backend source
        shell: powershell
        run: |
          $source = "${{ github.workspace }}\backend\"
          $dest   = "C:\sistemaarte\backend"
          if (!(Test-Path $dest)) { New-Item -ItemType Directory -Path $dest -Force }
          robocopy $source $dest /MIR /E /NFL /NDL /NJH /NJS `
            /XD node_modules data `
            /XF .env *.db
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit $LASTEXITCODE }

      - name: Install backend dependencies
        shell: powershell
        run: |
          Set-Location "C:\sistemaarte\backend"
          npm install --omit=dev --prefer-offline

      - name: Sinalizar restart via sentinela
        shell: powershell
        run: |
          $sentinel = "C:\sistemaarte\backend\.deploy-trigger"
          [System.IO.File]::WriteAllText($sentinel, (Get-Date -Format 'o'))
          Write-Host "Sentinela gravado: $sentinel"
          Write-Host "PM2-DeployRestart vai detectar em ate 1 minuto e reiniciar o processo."

      - name: Concluido
        shell: powershell
        run: Write-Host "Deploy concluido em $(Get-Date -Format 'dd/MM/yyyy HH:mm:ss')"
