name: Deploy Producao

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  testes:
    name: Testes Backend
    runs-on: self-hosted
    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias de teste
        working-directory: backend
        run: npm ci

      - name: Audit backend runtime dependencies
        working-directory: backend
        run: npm audit --omit=dev

      - name: Executar testes
        working-directory: backend
        run: npm test

  build-and-deploy:
    name: Build & Deploy
    runs-on: self-hosted
    needs: testes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar sentinela systemd
        run: |
          if systemctl is-active --quiet deploy-trigger.path; then
            echo "deploy-trigger.path esta ativo no systemd."
          else
            echo "Aviso: deploy-trigger.path nao esta ativo no systemd."
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy frontend dist
        run: |
          mkdir -p /var/www/sistemaarte/frontend/dist
          rsync -av --delete frontend/dist/ /var/www/sistemaarte/frontend/dist/

      - name: Sync backend source
        run: |
          mkdir -p /var/www/sistemaarte/backend
          rsync -av --delete \
            --exclude='node_modules' \
            --exclude='data' \
            --exclude='certs' \
            --exclude='.env' \
            --exclude='*.db' \
            --exclude='*.db-wal' \
            --exclude='*.db-shm' \
            backend/ /var/www/sistemaarte/backend/

      - name: Install backend runtime dependencies
        run: |
          cd /var/www/sistemaarte/backend
          npm ci --omit=dev --prefer-offline

      - name: Audit deployed backend runtime dependencies
        run: |
          cd /var/www/sistemaarte/backend
          npm audit --omit=dev

      - name: Sinalizar restart via sentinela
        run: |
          date -Iseconds > /var/www/sistemaarte/backend/.deploy-trigger
          echo "Sentinela gravada em /var/www/sistemaarte/backend/.deploy-trigger"
          echo "deploy-trigger.path do systemd detectara a alteracao e reiniciara o servico PM2 sistemaarte-backend."

      - name: Concluido
        run: echo "Deploy concluido em $(date '+%d/%m/%Y %H:%M:%S')"
