name: Debug PM2

on:
  workflow_dispatch:

jobs:
  debug:
    name: PM2 Status e Logs
    runs-on: self-hosted

    steps:
      - name: PM2 Status
        shell: powershell
        run: |
          $env:HOMEPATH = "C:\Users\Administrator"
          $env:HOME     = "C:\Users\Administrator"
          pm2 list

      - name: PM2 Error Log
        shell: powershell
        run: |
          $logPath = "C:\Users\Administrator\.pm2\logs\sistemaarte-backend-error.log"
          if (Test-Path $logPath) {
            Write-Host "=== ERRO LOG ==="
            Get-Content $logPath -Tail 80
          } else {
            Write-Host "Arquivo de log nao encontrado: $logPath"
          }

      - name: PM2 Out Log
        shell: powershell
        run: |
          $logPath = "C:\Users\Administrator\.pm2\logs\sistemaarte-backend-out.log"
          if (Test-Path $logPath) {
            Write-Host "=== OUT LOG ==="
            Get-Content $logPath -Tail 40
          } else {
            Write-Host "Arquivo de log nao encontrado: $logPath"
          }

      - name: Verificar .env
        shell: powershell
        run: |
          $envPath = "C:\sistemaarte\backend\.env"
          if (Test-Path $envPath) {
            Write-Host ".env existe"
            Get-Content $envPath | ForEach-Object {
              if ($_ -match '^(DB_|PORT|NODE_ENV|NFE_AMBIENTE|JWT_)') { $_ }
            }
          } else {
            Write-Host ".env NAO encontrado em $envPath"
          }

      - name: Verificar ecosystem.config.js
        shell: powershell
        run: |
          Get-Content "C:\sistemaarte\backend\ecosystem.config.js"
